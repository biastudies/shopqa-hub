<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopQA Hub</title>
<style>
:root{--bg:#0a1226;--bg2:#0d1a33;--card:#13233f;--line:#22406b;--tx:#e6eefc;--mu:#8ea3c7;--blue:#3b82f6;--cy:#22d3ee;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:232px;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;padding:0 8px}.logo b{color:var(--cy)}
.slog{font-size:11px;color:var(--mu);padding:0 8px 14px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);text-decoration:none;cursor:pointer}
nav a:hover{background:#16294a;color:var(--tx)}nav a.on{background:linear-gradient(90deg,#1d4ed8,#0e7490);color:#fff}
nav i{font-style:normal;width:18px;text-align:center}
.side-foot{margin-top:auto;font-size:11px;color:var(--mu);padding:8px}
main{flex:1;min-width:0;padding:24px 28px 48px;max-width:1280px}
h1{margin:0 0 4px;font-size:24px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .v{font-size:30px;font-weight:700}.kpi .l{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.cy{color:var(--cy)}
.btn{background:#1d3a66;border:1px solid var(--line);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--cy)}.btn.pri{background:var(--blue);border-color:var(--blue)}.btn.pri:hover{background:#2563eb}.btn.dg{color:#fca5a5}
input,select,textarea{background:#0b1730;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font:inherit;max-width:100%}
textarea{width:100%;min-height:110px}input:focus,select:focus,textarea:focus,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--cy)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
tr.cl{cursor:pointer}tr.cl:hover{background:#17294a}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;border:1px solid}
.bd.ok{background:#22c55e1f;border-color:#22c55e66}.bd.bad{background:#ef44441f;border-color:#ef444466}.bd.warn{background:#f59e0b1f;border-color:#f59e0b66}.bd.cy{background:#22d3ee1a;border-color:#22d3ee55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hb{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;margin:7px 0;cursor:pointer}
.hb:hover .tr i{filter:brightness(1.3)}.tr{background:#0b1730;border-radius:6px;height:14px}.tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cy))}
svg text{fill:var(--mu);font-size:10px}.pt{cursor:pointer}.pt:hover{r:7}
#md{position:fixed;inset:0;background:#030816bb;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#md.on{display:flex}.mb{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:20px}
.mb label{display:block;margin:10px 0 4px;color:var(--mu);font-size:12px}.mb input,.mb select{width:100%}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px}.toast.e{border-left-color:var(--bad)}
.prog{height:8px;background:#0b1730;border-radius:6px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cy));transition:width .3s}
.sc{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid #1a3157;align-items:center}.sc .st{width:20px;text-align:center}
.pend{color:var(--mu)}.runn{color:var(--cy)}
pre{background:#071022;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:12px/1.5 Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-word}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;color:#222}.shot .u{background:#e5e7eb;padding:6px 10px;font-size:11px;color:#555}.shot .pg{padding:22px;text-align:center}.shot .er{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;padding:8px;border-radius:4px;margin:10px auto;max-width:360px;font-size:12px}.shot .fk{height:26px;background:#e5e7eb;margin:6px auto;max-width:300px;border-radius:4px}
.vv{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px}.vs{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.vs:hover,.vs.on{border-color:var(--cy);background:#16305a}.vs.pair{border-style:dashed;border-color:var(--cy)}.vs small{display:block;color:var(--mu)}.vimp{grid-column:1/3;text-align:center;max-width:320px;justify-self:center;width:100%}
.warnb{background:#f59e0b14;border:1px solid #f59e0b55;color:#fcd34d;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.slog,.side-foot{display:none}nav{display:flex;overflow-x:auto;width:100%}nav a{white-space:nowrap}main{padding:16px}.vv{gap:8px 12px}}
@media print{aside,.bar,#toasts,.noprint{display:none!important}body,.card{background:#fff;color:#000}main{padding:0}.card{border-color:#ccc}th,td,.kpi .l,.sub{color:#000}svg text{fill:#333}}
</style></head><body>
<aside><div class="logo">SHOP<b>QA</b> HUB</div><div class="slog">Mais controle. Mais rastreabilidade. Mais confiança.</div>
<nav id="nav"></nav>
<div class="side-foot">Protótipo acadêmico. Execuções simuladas, sem testes reais.<br><br><button class="btn" onclick="resetDemo()">Restaurar dados demo</button></div></aside>
<main id="main"></main><div id="md"></div><div id="toasts"></div>
<script>
const KEY="shopqa_hub_v1",MODS=["Login","Catálogo","Carrinho","Valores","Checkout","API","KPIs"],TY={e2e:"E2E (Sistema)",api:"API (Integração)",unit:"Unitário"},TC={e2e:"#3b82f6",api:"#22d3ee",unit:"#a78bfa"},ENVS=["Staging","Sandbox","Produção"];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=(n,m,p)=>({n,m,p});
const SEED=[{id:"s1",name:"Jornada de Compra",type:"e2e",desc:"Login, catálogo, carrinho e checkout no SauceDemo (Playwright).",sc:[T("CT01 Login com dados válidos","Login",.03),T("CT02 Login com senha inválida","Login",.05),T("Logout encerra a sessão","Login",.04),T("CT05 Ordenar produtos por preço","Catálogo",.22),T("Exibir preços corretos","Catálogo",.08),T("CT03 Adicionar produto ao carrinho","Carrinho",.06),T("CT04 Remover produto do carrinho","Carrinho",.1),T("CT08 Subtotal de dois produtos","Valores",.12),T("CT07 Checkout sem campo obrigatório","Checkout",.18),T("CT06 Finalizar checkout","Checkout",.1)]},
{id:"s2",name:"Testes de API",type:"api",desc:"Produtos, carrinho e validação de respostas (Postman/Newman).",sc:[T("GET /products retorna 200","API",.04),T("Schema do produto","API",.15),T("POST /cart adiciona item","API",.2),T("Autenticação por token","API",.08),T("Latência abaixo de 500 ms","API",.25),T("GET /products/999 retorna 404","API",.06)]},
{id:"s3",name:"Testes Unitários",type:"unit",desc:"Cálculo de indicadores e processamento de resultados (Pytest/Jest).",sc:[T("Cálculo do Pass Rate","KPIs",.02),T("Cálculo da taxa de falha","KPIs",.03),T("Parser de resultados","KPIs",.12),T("Regra aprovado/falha","KPIs",.05)]}];
const MSG={Login:"Epic sadface: Username and password do not match any user",Catálogo:"Expected order [7.99, 9.99, 15.99] but received [15.99, 7.99, 9.99]",Carrinho:"Badge do carrinho mostra 2, esperado 1 item",Valores:"Subtotal 39.98 diferente de 29.98 esperado",Checkout:"Mensagem 'First Name is required' não exibida",API:"Esperado status 200, recebido 500",KPIs:"AssertionError: 0.84 != 0.85"};
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
function mkEv(sc,r){const m=sc.m,t=m==="API"?(r()<.5?"resp":"http"):m==="KPIs"?"log":["shot","log","err"][Math.floor(r()*3)],msg=MSG[m],h="12:0"+Math.floor(r()*9)+":"+(10+Math.floor(r()*49));
 const b={shot:{msg,url:"saucedemo.com/"+({Login:"",Catálogo:"inventory.html",Carrinho:"cart.html",Valores:"checkout-step-two.html",Checkout:"checkout-step-one.html"}[m]||"")},log:"["+h+"] INFO  iniciando "+sc.n+"\n["+h+"] WARN  tentativa 1 falhou\n["+h+"] ERROR "+msg,err:"Error: "+sc.n+"\n  "+msg+"\n    at tests/"+m.toLowerCase()+".spec.ts:"+(20+Math.floor(r()*60)),http:"POST /api/cart HTTP/1.1\nHost: demo-api.shopqa.test\nAuthorization: Bearer ***\nContent-Type: application/json\n\n{\"productId\": 7, \"qty\": 1}",resp:"HTTP/1.1 500 Internal Server Error\nContent-Type: application/json\nX-Latency: "+(380+Math.floor(r()*500))+"ms\n\n{\"error\":\"demo backend\",\"detail\":\""+msg+"\"}"}[t];
 return{k:t,title:{shot:"Screenshot",log:"Log de console",err:"Mensagem de erro",http:"Requisição HTTP",resp:"Resposta de API"}[t]+" — "+sc.n,b}}
function sim(su,env,r){const f=env==="Sandbox"?1.25:env==="Produção"?.8:1,res=su.sc.map(s=>{const ok=r()>s.p*f;return{n:s.n,m:s.m,ok,ev:ok?null:mkEv(s,r)}}),fail=res.filter(x=>!x.ok).length,n=res.length;
 return{id:"r"+Math.floor(r()*1e9).toString(36)+Date.now().toString(36),suite:su.name,type:su.type,env,dur:Math.round(n*(1.5+r()*2.5)),pass:n-fail,fail,lat:su.type==="unit"?0:Math.round(160+r()*260),status:fail===0?"Aprovada":fail/n>=.25?"Reprovada":"Com falhas",res}}
function seed(){const r=rng(42),runs=[];for(let i=0;i<14;i++){const run=sim(SEED[i%3],i%3===1?"Sandbox":"Staging",r);run.ts=Date.now()-(14-i)*864e5+i*36e5;run.id="seed"+i;runs.push(run)}return{suites:JSON.parse(JSON.stringify(SEED)),runs,integ:{}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(m,e){const d=document.createElement("div");d.className="toast"+(e?" e":"");d.textContent=m;$("#toasts").append(d);setTimeout(()=>d.remove(),3200)}
function modal(h){$("#md").innerHTML='<div class="mb">'+h+"</div>";$("#md").classList.add("on")}
function closeM(){$("#md").classList.remove("on");clearInterval(TM)}
$("#md").onclick=e=>{if(e.target.id==="md")closeM()};document.onkeydown=e=>{if(e.key==="Escape")closeM()};
let TM;
const bd=s=>'<span class="bd '+({Aprovada:"ok",Reprovada:"bad","Com falhas":"warn"}[s]||"cy")+'">'+s+"</span>";
const dt=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const pr=(p,f)=>p+f?Math.round(p/(p+f)*100):0;
function stats(runs){const p=runs.reduce((a,r)=>a+r.pass,0),f=runs.reduce((a,r)=>a+r.fail,0),l=runs.filter(r=>r.lat);return{p,f,t:p+f,pr:pr(p,f),lat:l.length?Math.round(l.reduce((a,r)=>a+r.lat,0)/l.length):0}}
function byMod(runs){const o={};MODS.forEach(m=>o[m]=0);runs.forEach(r=>r.res.forEach(x=>{if(!x.ok)o[x.m]=(o[x.m]||0)+1}));return Object.entries(o).filter(e=>e[1]).sort((a,b)=>b[1]-a[1])}
const sorted=()=>[...S.runs].sort((a,b)=>a.ts-b.ts);
function line(runs){const W=620,H=200,P=30,n=runs.length,x=i=>P+i*(W-2*P)/Math.max(n-1,1),y=v=>H-P-(v-40)/60*(H-2*P);
 let g="";[40,60,80,100].forEach(v=>g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#22406b" stroke-dasharray="3 4"/><text x="2" y="'+(y(v)+3)+'">'+v+"%</text>");
 const pts=runs.map((r,i)=>[x(i),y(Math.max(40,pr(r.pass,r.fail))),r]);
 return'<svg viewBox="0 0 '+W+" "+H+'" width="100%">'+g+'<path d="M'+pts.map(p=>p[0]+","+p[1]).join("L")+'" fill="none" stroke="#22d3ee" stroke-width="2.5"/>'+pts.map(p=>'<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="#3b82f6" stroke="#22d3ee" onclick="openRun(\''+p[2].id+'\')"><title>'+p[2].suite+" — "+pr(p[2].pass,p[2].fail)+"% ("+dt(p[2].ts)+")</title></circle>").join("")+"</svg>"}
function bars(runs,go){const m=byMod(runs),mx=m.length?m[0][1]:1;return m.length?m.map(e=>'<div class="hb" title="Ver evidências de '+e[0]+'" onclick="'+(go?"F.em='"+e[0]+"';nav('evidencias')":"")+'"><span>'+e[0]+'</span><div class="tr"><i style="width:'+e[1]/mx*100+'%"></i></div><b>'+e[1]+"</b></div>").join(""):'<p class="sub">Sem falhas registradas.</p>'}
function donut(runs){const t={e2e:0,api:0,unit:0};runs.forEach(r=>t[r.type]+=r.pass+r.fail);const tot=t.e2e+t.api+t.unit||1;let off=0,c="";
 for(const k in t){const l=t[k]/tot*251.3;c+='<circle r="40" cx="60" cy="60" fill="none" stroke="'+TC[k]+'" stroke-width="18" stroke-dasharray="'+l+" "+(251.3-l)+'" stroke-dashoffset="'+-off+'" transform="rotate(-90 60 60)"><title>'+TY[k]+": "+t[k]+" cenários</title></circle>";off+=l}
 return'<div class="row"><svg viewBox="0 0 120 120" width="140">'+c+'<text x="60" y="64" text-anchor="middle" style="font-size:14px;fill:#e6eefc;font-weight:700">'+tot+'</text></svg><div class="leg" style="flex-direction:column">'+Object.keys(t).map(k=>'<span><i style="background:'+TC[k]+'"></i>'+TY[k]+" — "+t[k]+" ("+Math.round(t[k]/tot*100)+"%)</span>").join("")+"</div></div>"}
function runTable(list,lim){return'<div class="tw"><table><tr><th>Suíte</th><th>Tipo</th><th>Ambiente</th><th>Data</th><th>Duração</th><th>Aprov.</th><th>Reprov.</th><th>Status</th></tr>'+list.slice(0,lim||999).map(r=>'<tr class="cl" onclick="openRun(\''+r.id+'\')"><td>'+esc(r.suite)+"</td><td>"+TY[r.type]+"</td><td>"+r.env+"</td><td>"+dt(r.ts)+"</td><td>"+r.dur+'s</td><td class="ok">'+r.pass+'</td><td class="bad">'+r.fail+"</td><td>"+bd(r.status)+"</td></tr>").join("")+"</table></div>"||""}
const kp=(l,v,c)=>'<div class="card kpi"><div class="l">'+l+'</div><div class="v '+(c||"")+'">'+v+"</div></div>";
function kpis(){const s=stats(S.runs);return'<div class="grid g4">'+kp("Pass Rate",s.pr+"%",s.pr>=80?"ok":"warn")+kp("Testes executados",s.t)+kp("Falhas",s.f,"bad")+kp("Latência média das APIs",s.lat+" ms","cy")+"</div>"}
const F={q:"",ty:"",st:"",en:"",ek:"",em:""};
const PAGES={
dashboard(){const rs=sorted();return"<h1>Dashboard</h1><p class=sub>Saúde do e-commerce em pré-produção, calculada a partir de todas as execuções.</p>"+kpis()+'<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Evolução do Pass Rate (últimas execuções)</h2>'+line(rs.slice(-14))+'</div><div class="card"><h2>Falhas por módulo <small class=sub>(clique para ver evidências)</small></h2>'+bars(S.runs,1)+'</div><div class="card"><h2>Distribuição por tipo de teste</h2>'+donut(S.runs)+'</div><div class="card"><h2>Últimas execuções</h2>'+runTable([...rs].reverse(),6)+"</div></div>"},
suites(){return'<h1>Suítes de Testes</h1><p class=sub>Crie, edite e execute suítes. A execução é simulada.</p><div class="bar"><button class="btn pri" onclick="suiteForm()">+ Nova suíte</button></div><div class="grid g3">'+(S.suites.map(s=>'<div class="card"><div class="row"><h2 style="margin:0">'+esc(s.name)+'</h2><span class="sp"></span><span class="bd cy">'+TY[s.type]+'</span></div><p class=sub style="margin:8px 0">'+esc(s.desc)+"</p><div class=sub style='margin-bottom:10px'>"+s.sc.length+' cenários</div><div class="row"><select id="env'+s.id+'">'+ENVS.map(e=>"<option>"+e+"</option>").join("")+'</select><button class="btn pri" onclick="runSuite(\''+s.id+'\')">▶ Executar testes</button></div><div class="row" style="margin-top:10px"><button class="btn" onclick="showSc(\''+s.id+'\')">Cenários</button><button class="btn" onclick="suiteForm(\''+s.id+'\')">Editar</button><button class="btn dg" onclick="delSuite(\''+s.id+'\')">Excluir</button></div></div>').join("")||'<p class="sub">Nenhuma suíte. Crie a primeira com “Nova suíte”.</p>')+"</div>"},
execucoes(){const l=sorted().reverse().filter(r=>(!F.q||r.suite.toLowerCase().includes(F.q.toLowerCase()))&&(!F.ty||r.type===F.ty)&&(!F.st||r.status===F.st)&&(!F.en||r.env===F.en));
 return'<h1>Execuções</h1><p class=sub>Histórico completo. Execuções iniciadas em Suítes aparecem aqui automaticamente.</p><div class="bar"><input placeholder="Pesquisar suíte…" value="'+esc(F.q)+'" oninput="F.q=this.value;fl(\'execucoes\',this)">'+sel("ty",[["","Todos os tipos"],...Object.entries(TY)])+sel("st",[["","Todos os status"],["Aprovada","Aprovada"],["Com falhas","Com falhas"],["Reprovada","Reprovada"]])+sel("en",[["","Todos os ambientes"],...ENVS.map(e=>[e,e])])+'</div><div class="card">'+(l.length?runTable(l):'<p class="sub">Nenhuma execução encontrada com estes filtros.</p>')+"</div>"},
evidencias(){let it=[];sorted().reverse().forEach(r=>r.res.forEach((x,i)=>{if(!x.ok)it.push({r,x,i})}));it=it.filter(e=>(!F.ek||e.x.ev.k===F.ek)&&(!F.em||e.x.m===F.em));const KN={shot:"🖼 Screenshot",log:"▤ Log",err:"⚠ Erro",http:"⇄ Requisição",resp:"⇦ Resposta"};
 return'<h1>Central de Evidências</h1><p class=sub>Evidências demonstrativas associadas a cada falha.</p><div class="bar">'+sel("ek",[["","Todos os tipos"],...Object.entries(KN)])+sel("em",[["","Todos os módulos"],...MODS.map(m=>[m,m])])+'<span class="sub">'+it.length+" evidências</span></div><div class='grid g3'>"+(it.slice(0,60).map(e=>'<div class="card tc cl" style="cursor:pointer" onclick="openEv(\''+e.r.id+"',"+e.i+')"><div class="row"><span class="bd bad">'+KN[e.x.ev.k]+'</span><span class="bd cy">'+e.x.m+"</span></div><p style='margin:8px 0 4px'>"+esc(e.x.n)+'</p><span class="sub">'+esc(e.r.suite)+" • "+e.r.env+" • "+dt(e.r.ts)+"</span></div>").join("")||'<p class="sub">Nenhuma evidência com estes filtros.</p>')+"</div>"},
modelov(){return"<h1>Modelo V</h1><p class=sub>Clique em uma etapa para ver a descrição e o teste correspondente. Passe o mouse para destacar o par.</p><div class='card'><div class='vv' id='vv'></div></div><div class='card' id='vd' style='margin-top:14px'><p class=sub>Selecione uma etapa do Modelo V.</p></div>"},
relatorios(){const rs=sorted();const bt=Object.keys(TY).map(k=>{const l=S.runs.filter(r=>r.type===k),s=stats(l);return"<tr><td>"+TY[k]+"</td><td>"+l.length+"</td><td>"+s.t+'</td><td class="ok">'+s.p+'</td><td class="bad">'+s.f+"</td><td>"+s.pr+"%</td></tr>"}).join("");
 return'<h1>Relatórios</h1><p class=sub>Relatório demonstrativo gerado com os dados simulados do protótipo.</p><div class="bar noprint"><button class="btn pri" onclick="csv()">⇩ Exportar CSV</button><button class="btn" onclick="window.print()">⎙ Exportar PDF (imprimir)</button></div>'+kpis()+'<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Evolução do Pass Rate</h2>'+line(rs.slice(-14))+'</div><div class="card"><h2>Falhas por módulo</h2>'+bars(S.runs)+'</div></div><div class="card" style="margin-top:14px"><h2>Resultados por tipo de teste</h2><div class="tw"><table><tr><th>Tipo</th><th>Execuções</th><th>Cenários</th><th>Aprovados</th><th>Reprovados</th><th>Pass Rate</th></tr>'+bt+'</table></div></div><div class="card" style="margin-top:14px"><h2>Histórico de execuções</h2>'+runTable([...rs].reverse(),12)+"</div>"},
integracoes(){const I=[["Playwright","Testes E2E no navegador (SauceDemo)","Gera os resultados e evidências do nível Sistema.","Demonstrativa"],["Postman/Newman","Testes de API via linha de comando","Valida contratos de catálogo, carrinho e autenticação.","Demonstrativa"],["Pytest/Jest","Testes unitários","Cobre a lógica interna do Hub (KPIs, parser, regra aprovado/falha).","Demonstrativa"],["GitHub Actions","Esteira de CI/CD","Dispararia as suítes via webhook a cada alteração.","Prevista"],["Slack e e-mail","Notificações","Avisaria o time quando uma execução tiver falhas.","Prevista"]];
 return'<h1>Integrações</h1><p class=sub>Nenhuma conexão real é feita. O botão apenas simula o estado no protótipo.</p><div class="grid g3">'+I.map((x,i)=>{const on=S.integ[x[0]];return'<div class="card"><div class="row"><h2 style="margin:0">'+x[0]+'</h2><span class="sp"></span><span class="bd '+(x[3]==="Prevista"?"warn":"cy")+'">'+x[3]+"</span></div><p style='margin:8px 0 2px'>"+x[1]+'</p><p class="sub" style="margin:0 0 12px">'+x[2]+'</p><div class="row"><span class="bd '+(on?"ok":"cy")+'">'+(on?"Conexão simulada ativa":"Desconectada")+'</span><span class="sp"></span><button class="btn" onclick="tgInt(\''+x[0]+'\')">'+(on?"Desconectar":"Simular conexão")+"</button></div></div>"}).join("")+"</div>"}};
function sel(k,o){return'<select onchange="F.'+k+'=this.value;go()">'+o.map(x=>'<option value="'+esc(x[0])+'"'+(F[k]===x[0]?" selected":"")+">"+x[1]+"</option>").join("")+"</select>"}
function fl(p,el){const pos=el.selectionStart;go();const i=$("main input");if(i){i.focus();i.setSelectionRange(pos,pos)}}
const NAV=[["dashboard","◫","Dashboard"],["suites","☰","Suítes de Testes"],["execucoes","▷","Execuções"],["evidencias","⌕","Central de Evidências"],["modelov","⋁","Modelo V"],["relatorios","▤","Relatórios"],["integracoes","⌁","Integrações"]];
let cur="dashboard";
function go(){clearInterval(TM);$("#main").innerHTML=PAGES[cur]();$("#nav").innerHTML=NAV.map(n=>'<a href="#'+n[0]+'" class="'+(n[0]===cur?"on":"")+'"><i>'+n[1]+"</i>"+n[2]+"</a>").join("");if(cur==="modelov")drawV()}
function nav(p){location.hash=p;if(cur!==p){cur=p;go()}else go()}
window.onhashchange=()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==cur){cur=h;go();scrollTo(0,0)}};
function openRun(id){const r=S.runs.find(x=>x.id===id);if(!r)return;modal('<div class="row"><h2 style="margin:0">'+esc(r.suite)+'</h2><span class="sp"></span>'+bd(r.status)+'</div><p class=sub>'+TY[r.type]+" • "+r.env+" • "+dt(r.ts)+" • "+r.dur+"s • Pass Rate "+pr(r.pass,r.fail)+"%"+(r.lat?" • latência "+r.lat+" ms":"")+"</p>"+r.res.map((x,i)=>'<div class="sc"><span class="st '+(x.ok?"ok":"bad")+'">'+(x.ok?"✔":"✖")+'</span><span style="flex:1">'+esc(x.n)+'</span><span class="bd cy">'+x.m+"</span>"+(x.ok?"":'<button class="btn" onclick="openEv(\''+r.id+"',"+i+')">Evidência</button>')+"</div>").join("")+'<div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="closeM()">Fechar</button></div>')}
function openEv(id,i){const r=S.runs.find(x=>x.id===id),x=r.res[i],e=x.ev;let b;if(e.k==="shot")b='<div class="shot"><div class="u">🔒 '+esc(e.b.url)+'</div><div class="pg"><b>Swag Labs</b><div class="fk"></div><div class="fk"></div><div class="er">✖ '+esc(e.b.msg)+"</div></div></div>";else b="<pre>"+esc(e.b)+"</pre>";
 modal('<h2>'+esc(e.title)+'</h2><p class=sub>Módulo '+x.m+" • "+esc(r.suite)+" • "+r.env+" • "+dt(r.ts)+"</p>"+b+'<p class="sub" style="margin-top:10px">Evidência demonstrativa gerada pela simulação.</p><div class="row" style="margin-top:8px"><button class="btn" onclick="openRun(\''+r.id+'\')">Ver execução</button><span class="sp"></span><button class="btn" onclick="closeM()">Fechar</button></div>')}
function showSc(id){const s=S.suites.find(x=>x.id===id);modal("<h2>Cenários — "+esc(s.name)+"</h2>"+s.sc.map(c=>'<div class="sc"><span style="flex:1">'+esc(c.n)+'</span><span class="bd cy">'+esc(c.m)+'</span><span class="sub">risco '+Math.round(c.p*100)+"%</span></div>").join("")+'<div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" onclick="closeM()">Fechar</button></div>')}
function suiteForm(id){const s=id?S.suites.find(x=>x.id===id):{name:"",type:"e2e",desc:"",sc:[]};modal("<h2>"+(id?"Editar":"Nova")+' suíte</h2><label>Nome</label><input id="fn" value="'+esc(s.name)+'"><label>Tipo</label><select id="ft">'+Object.entries(TY).map(e=>'<option value="'+e[0]+'"'+(s.type===e[0]?" selected":"")+">"+e[1]+"</option>").join("")+'</select><label>Descrição</label><input id="fd" value="'+esc(s.desc)+'"><label>Cenários (um por linha: Nome | Módulo | risco de falha % opcional)</label><textarea id="fs">'+esc(s.sc.map(c=>c.n+" | "+c.m+" | "+Math.round(c.p*100)).join("\n"))+'</textarea><p class="sub">Módulos: '+MODS.join(", ")+'.</p><div class="row"><span class="sp"></span><button class="btn" onclick="closeM()">Cancelar</button><button class="btn pri" onclick="saveSuite(\''+(id||"")+'\')">Salvar suíte</button></div>')}
function saveSuite(id){const n=$("#fn").value.trim(),sc=$("#fs").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split("|").map(x=>x.trim());return T(p[0],MODS.includes(p[1])?p[1]:"Login",Math.min(.9,Math.max(0,(parseFloat(p[2])||10)/100)))});
 if(!n||!sc.length)return toast("Informe um nome e ao menos um cenário.",1);const o={name:n,type:$("#ft").value,desc:$("#fd").value.trim()||"Sem descrição.",sc};if(id)Object.assign(S.suites.find(x=>x.id===id),o);else S.suites.push({id:"s"+Date.now(),...o});save();closeM();go();toast(id?"Suíte atualizada.":"Suíte criada.")}
function delSuite(id){const s=S.suites.find(x=>x.id===id);modal("<h2>Excluir suíte?</h2><p>“"+esc(s.name)+"” será removida. O histórico de execuções é mantido.</p><div class='row'><span class='sp'></span><button class='btn' onclick='closeM()'>Cancelar</button><button class='btn dg' onclick=\"S.suites=S.suites.filter(x=>x.id!=='"+id+"');save();closeM();go();toast('Suíte excluída.')\">Excluir</button></div>")}
function runSuite(id){const s=S.suites.find(x=>x.id===id),env=$("#env"+id).value,run=sim(s,env,Math.random),n=s.sc.length;run.ts=Date.now();
 modal("<h2>Executando: "+esc(s.name)+'</h2><p class="sub">Ambiente '+env+'</p><div class="warnb">Simulação: nenhum teste real é executado em ferramentas externas.</div><div class="prog"><i id="pg"></i></div><div id="sl">'+run.res.map((x,i)=>'<div class="sc"><span class="st pend" id="st'+i+'">○</span><span style="flex:1">'+esc(x.n)+'</span><span class="pend" id="tx'+i+'">pendente</span></div>').join("")+'</div><div id="fin"></div>');
 let i=0;const step=()=>{if(i>0){const p=run.res[i-1];$("#st"+(i-1)).className="st "+(p.ok?"ok":"bad");$("#st"+(i-1)).textContent=p.ok?"✔":"✖";$("#tx"+(i-1)).className=p.ok?"ok":"bad";$("#tx"+(i-1)).textContent=p.ok?"aprovado":"reprovado"}
  if(i<n){$("#st"+i).textContent="◔";$("#st"+i).className="st runn";$("#tx"+i).className="runn";$("#tx"+i).textContent="executando…";$("#pg").style.width=i/n*100+"%";i++}
  else{clearInterval(TM);$("#pg").style.width="100%";S.runs.push(run);save();$("#fin").innerHTML='<div class="row" style="margin-top:14px">'+bd(run.status)+"<b>"+run.pass+" aprovados, "+run.fail+" reprovados — Pass Rate "+pr(run.pass,run.fail)+'%</b><span class="sp"></span><button class="btn" onclick="closeM();nav(\'execucoes\')">Ver no histórico</button><button class="btn pri" onclick="openRun(\''+run.id+'\')">Detalhes</button></div>';toast("Execução concluída e registrada em Execuções.",run.fail>0&&run.status==="Reprovada")}};
 clearInterval(TM);TM=setInterval(step,420);step()}
function csv(){const L=[["Suíte","Tipo","Ambiente","Data","Duração(s)","Aprovados","Reprovados","Status"]];sorted().forEach(r=>L.push([r.suite,TY[r.type],r.env,new Date(r.ts).toISOString(),r.dur,r.pass,r.fail,r.status]));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.map(l=>l.map(c=>'"'+c+'"').join(";")).join("\n")],{type:"text/csv"}));a.download="shopqa-relatorio.csv";a.click();toast("Relatório CSV gerado.")}
function tgInt(k){S.integ[k]=!S.integ[k];save();go();toast(k+(S.integ[k]?": conexão simulada ativada (demonstrativo).":": desconectado."))}
function resetDemo(){S=seed();save();go();toast("Dados de demonstração restaurados.")}
const V=[["Requisitos de negócio","Aceitação (UAT)","Valida regras de negócio (checkout, descontos, LGPD) com lojistas e Product Owners.","Validação futura com lojistas ou Product Owners. Ainda não realizada.",null],
["Requisitos de sistema","Testes de sistema (E2E)","Verifica os fluxos completos da loja como um usuário faria.","Playwright no SauceDemo","e2e"],
["Arquitetura e design","Testes de integração (API)","Verifica o contrato e as respostas entre componentes e serviços.","Postman/Newman em API pública de demonstração","api"],
["Design detalhado","Testes unitários","Verifica a lógica interna de cada módulo do Hub.","Pytest/Jest (KPIs, parser de resultados, regra aprovado/falha)","unit"]];
function drawV(){let h="";V.forEach((v,i)=>{h+='<div class="vs" data-i="'+i+'" style="margin-left:'+i*18+'px" onclick="selV('+i+')" onmouseenter="hoV('+i+',1)" onmouseleave="hoV('+i+',0)"><b>Verificação</b><small>'+v[0]+'</small></div><div class="vs" data-i="'+i+'" style="margin-right:'+i*18+'px" onclick="selV('+i+')" onmouseenter="hoV('+i+',1)" onmouseleave="hoV('+i+',0)"><b>Validação</b><small>'+v[1]+"</small></div>"});
 h+='<div class="vs vimp" onclick="selV(4)"><b>Implementação</b><small>Codificação do Hub e dos scripts de teste</small></div>';$("#vv").innerHTML=h}
function hoV(i,on){document.querySelectorAll('.vs[data-i="'+i+'"]').forEach(e=>e.classList.toggle("pair",!!on))}
function selV(i){document.querySelectorAll(".vs").forEach(e=>e.classList.remove("on"));document.querySelectorAll('.vs[data-i="'+i+'"]').forEach(e=>e.classList.add("on"));
 if(i===4){$("#vd").innerHTML="<h2>Implementação</h2><p>Ponto de virada do V: o código é escrito aqui e depois verificado pelos níveis de teste, de baixo para cima.</p>";return}
 const v=V[i],l=v[4]?S.runs.filter(r=>r.type===v[4]):[],s=stats(l);
 $("#vd").innerHTML="<h2>"+v[0]+" ↔ "+v[1]+"</h2><p>"+v[2]+"</p><p><b>Ferramenta:</b> "+v[3]+'</p>'+(v[4]?'<div class="grid g4">'+kp("Execuções",l.length)+kp("Pass Rate",s.pr+"%","ok")+kp("Falhas",s.f,"bad")+"</div><div class='bar' style='margin-top:12px'><button class='btn' onclick=\"F.ty='"+v[4]+"';nav('execucoes')\">Ver execuções deste nível</button></div>":'<p class="warn">Sem execuções: nível previsto para etapa futura.</p>')}
cur=PAGES[location.hash.slice(1)]?location.hash.slice(1):"dashboard";go();
</script></body></html>
